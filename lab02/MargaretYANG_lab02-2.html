<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>Lab 2 Part 2 Cities Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            width: 200px;
            padding: 20px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        /* Each row for a magnitude value. */
        .break {
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* The circular symbol. */
        .dot {
            display: inline-block;
            margin-top: 5px;
            border-radius: 50%;
            opacity: 0.6;
        }

        /* Label next to the symbol. */
        .dot-label {
            position: absolute;
            top: 0;
            right: 0;
            font-style: italic;
        }

        /* Link color within the legend. */
        #legend a {
            color:black;
        }
   </style>
</head>
<body>
   <div id='map'></div>
   <div id="legend"></div>
    <script>
        // Anchor the legend to the HTML element with id="legend".
        const legend = document.getElementById('legend');
        const grades = ['15,001 - 412,968', '412,969 - 1,733,846', '1,733,847 - 4,931,603', '4,931,604 - 10,381,288', '10,381,289 - 31,480,498'];
        const radii = [3, 5, 7, 10, 14];
        const colors = ['#d7e6f4', '#c8dcf0', '#73b2d8', '#2979b9', '#08306b'];
        const labels = ['<strong>Population</strong>'];

        for (let i = 0; i < grades.length; i++) {
            const value = grades[i];
            const diameter = 2 * radii[i];

            labels.push(
                '<p class="break"><i class="dot" style="background:' + colors[i] +
                '; width:' + diameter + 'px; height:' + diameter +
                'px;"></i> <span class="dot-label" style="top:' +
                diameter / 2 + 'px;">' + value + '</span></p>'
            );
        }

        const source =
            '<p style="text-align:right; font-size:10pt;">Source: ' +
            '<a href="https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-populated-places/">Natural Earth</a></p>';

        legend.innerHTML = labels.join('') + source;
    </script>
   <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoianlhbmcxMjAiLCJhIjoiY211enVzaHdoMDB3NDJ4b3ppYjQxMmpheSJ9.GYRscFDXc97_IWa1Cf9skg';
        const mymap = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            projection: 'globe',
            center: [-96, 37.8],
            zoom: 1
        });
        
         mymap.on('style.load', () => {
            mymap.setFog({});
        });

        mymap.on('load', () => {
            mymap.addSource('population', {
                type: 'geojson',
                data: 'data/world-cities.geojson'
            });

            mymap.addLayer({
                id: 'cities_layer',
                type: 'circle',
                source: 'population',
                paint: {
                    'circle-radius': [
                        'step',
                        ['get', 'population'], 
                        3,
                        412969, 5,
                        1733847, 7,
                        4931604, 10,
                        10381289, 14
                    ],
                    'circle-color': [
                        'step',
                        ['get', 'population'], 
                        '#d7e6f4',
                        412969, '#c8dcf0',
                        1733847, '#73b2d8',
                        4931604, '#2979b9',
                        10381289, '#08306b'
                    ],
                    'circle-stroke-width': 1,
                    'circle-stroke-color': 'white'
                }
            });

            mymap.addLayer({
                id: 'megacities',
                type: 'circle',
                source: 'population',
                filter: ['>=', ['get', 'population'], 10000000],
                paint: {
                    'circle-radius': 13,
                    'circle-color': '#d7301f',
                    'circle-stroke-color': 'black',
                    'circle-stroke-width': 2
                }
            })

            mymap.on('click', 'cities_layer', (event) => {
                const feature = event.features[0];
                const coordinates = feature.geometry.coordinates.slice(0, 2);

                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(`<strong>City:</strong> ${feature.properties.city}`)
                    .addTo(mymap);
            });

        })


    </script>
</body>
</html>
